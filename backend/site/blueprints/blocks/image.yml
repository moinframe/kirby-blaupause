name: field.blocks.image.name
icon: image
preview: image
fields:
  image:
    label: field.blocks.image.name
    extends: fields/image
  caption:
    label: field.blocks.image.caption
    type: writer
    icon: text
    inline: true
  link:
    label: field.blocks.image.link
    type: link
    icon: url
  ratio:
    label: field.blocks.image.ratio
    type: select
    placeholder: panel.blocks.image.fields.ratio.placeholder
    width: 1/2
    options:
      1/1: "1:1"
      16/9: "16:9"
      10/8: "10:8"
      21/9: "21:9"
      7/5: "7:5"
      4/3: "4:3"
      5/3: "5:3"
      3/2: "3:2"
      3/1: "3:1"
  crop:
    label: field.blocks.image.crop
    type: toggle
    width: 1/2
  maxwidth:
    label: panel.blocks.image.fields.maxwidth.label
    type: number
    after: px
    width: 1/4
    min: 0
  alignment:
    extends: fields/alignment
    width: 3/4
    grow: true
