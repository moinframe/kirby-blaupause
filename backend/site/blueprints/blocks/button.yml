name: panel.blocks.button.name
icon: url
fields:
  text:
    type: text
    required: true
  link:
    type: link
    required: true
  alignment: fields/alignment
  style:
    label: panel.blocks.button.fields.style.label
    type: toggles
    default: default
    options:
      default:
        *: panel.blocks.button.fields.style.options.default.text
      text:
        *: panel.blocks.button.fields.style.options.text.text
    required: true
